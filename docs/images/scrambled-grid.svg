<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 478" role="img" aria-labelledby="title description">
  <title id="title">Adjacency matrix reordering</title>
  <desc id="description">Comparison of original, shuffled, and Reverse Cuthill–McKee vertex orders for a graph with 16 vertices and 24 edges. Filled cells represent edges. The dashed line marks the main diagonal. Original has bandwidth 10 and lower profile 80. Shuffled has bandwidth 10 and lower profile 65. RCM has bandwidth 4 and lower profile 46.</desc>
